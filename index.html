/* ===== video call ===== */
function startCall(cfg){
  const ov = document.createElement('div'); ov.className = 'callwrap'; document.body.appendChild(ov); document.body.style.overflow = 'hidden';
  ov.innerHTML = `<div class="callvid"><div class="callinfo"><b>Kkaebi</b><span data-clock>0:00</span>, ${cfg.mode === 'ai' ? esc(cfg.topic.t) : esc(cfg.call.title)}</div><div class="callself">${IC.mic.replace('<svg','<svg width="26" height="26"')}<br>You</div><div class="rb callrb" data-rb>${bot('wave')}</div></div>
   <div class="caption" data-cap><div class="ko">Connecting…</div></div>
   <div class="callbar"><div class="hints" data-hints></div><div class="inrow"><button class="roundbtn dark" data-mic aria-label="Speak">${IC.mic}</button><input data-in placeholder="Type in Korean or English" autocomplete="off"><button class="roundbtn mint" data-send aria-label="Send">${IC.send}</button><button class="roundbtn red" data-end aria-label="End call">${IC.phone}</button></div></div>`;
  const cap = $('[data-cap]', ov), hintsEl = $('[data-hints]', ov), inp = $('[data-in]', ov), rb = $('[data-rb]', ov);
  const st = { hist:[], turns:0, t0:Date.now(), k:0, busy:false, ended:false, showEn:false };
  const clock = setInterval(() => { $('[data-clock]', ov).textContent = fmtTime(Date.now() - st.t0); }, 1000);
  const cw = S.settings.cast === 's' ? 's' : S.settings.cast === 'k' ? 'k' : pick(['k','s']), mood = m => rb.innerHTML = bot(m, '', cw);
  let lastUser = '';
  const say = async (ko, en, fix) => {
    cap.innerHTML = `${lastUser ? `<div class="callcap-user">You: ${esc(lastUser)}</div>` : ''}<div class="ko">${esc(ko)}</div>${S.settings.roma ? `<div class="roma" style="color:#A6B6D6">${esc(roma(ko))}</div>` : ''}<div class="en" ${st.showEn ? '' : 'hidden'}>${esc(en || '')}</div>${fix ? `<div class="fix">Try: <span class="ko">${esc(fix.right)}</span>${fix.note ? ' · ' + esc(fix.note) : ''}</div>` : ''}<button class="linkbtn" style="color:#7CF5E6" data-tr>${st.showEn ? 'Hide' : 'Show'} translation</button> <button class="linkbtn" style="color:#7CF5E6" data-rep>Repeat</button>`;
    $('[data-tr]', cap).onclick = () => { st.showEn = !st.showEn; $('.en', cap).hidden = !st.showEn; $('[data-tr]', cap).textContent = (st.showEn ? 'Hide' : 'Show') + ' translation'; };
    $('[data-rep]', cap).onclick = () => { mood('talk'); speak(ko, true, null, cw).then(() => mood('idle')); };
    mood('talk'); await speak(ko, false, null, cw); if (!st.ended) mood('idle');
  };
  const setHints = hs => { hintsEl.innerHTML = hs.map((h, i) => `<button data-h="${i}"><span class="ko">${esc(h.ko)}</span><small>${esc(h.en)}</small></button>`).join(''); $$('[data-h]', hintsEl).forEach(b => b.onclick = () => { const h = hs[+b.dataset.h]; if (h.ko.includes('___')){ inp.value = h.ko.split('___')[0]; inp.focus(); } else send(h.ko); }); };
  const thinking = () => { cap.innerHTML = `${lastUser ? `<div class="callcap-user">You: ${esc(lastUser)}</div>` : ''}<span class="thinking"><i></i><i></i><i></i></span>`; mood('idle'); };
  const end = async () => {
    if (st.ended) return; st.ended = true; clearInterval(clock); try { speechSynthesis.cancel(); CAP.tts && CAP.tts.stop && CAP.tts.stop(); } catch(e){}
    ov.remove(); document.body.style.overflow = '';
    if (st.turns >= 3){ cfg.onDone && cfg.onDone(); const xp = addXP(10); S.stats.calls++; const sk = markActivity(); save(); await modal({ robot:'wave', title:'Call ended', text:`${fmtTime(Date.now() - st.t0)} on the call with ${st.turns} ${st.turns === 1 ? 'reply' : 'replies'}. +${xp} XP.` }); afterRewards(sk); }
    else { await modal({ robot:'sad', title:'Call ended', text:'Calls count once you send three replies. Kkaebi will be here when you call back.' }); refresh(); }
  };
  $('[data-end]', ov).onclick = end;
  async function aiTurn(){
    st.busy = true; thinking();
    const u = currentUnit(), known = sample(learnedWords(), 40).map(w => w.ko).join(', ');
    const prompt = `You are 깨비 (Kkaebi), a cheerful little dokkaebi (the goblin of Korean folktales) who carries a club and loves rice cakes, on a short video call helping someone practise spoken Korean.
Learner level: CEFR ${u.sec.cefr}, currently on the unit "${u.title}" in the section "${u.sec.title}". Words the learner knows: ${known || 'very few; stick to greetings, 네, 아니요 and very simple words'}.
Topic: ${cfg.topic.t} (${cfg.topic.d}).
Rules:
- Reply with 1 or 2 short Korean sentences in polite 해요 style at the learner's level, and usually end with one easy question.
- If the learner's last message has a clear mistake, or is written in English, give the natural Korean version in "fix" with a one-sentence English note. Otherwise "fix" is null.
- Give exactly 3 short replies the learner could say next, at their level.
- After about 8 learner replies, say goodbye warmly and set "end" to true.
Return only JSON: {"ko":"...","en":"English translation of your reply","fix":null,"hints":[{"ko":"...","en":"..."}],"end":false}
Conversation so far:
${st.hist.map(h => (h.who === 'nuri' ? 'Kkaebi: ' : 'Learner: ') + h.text).join('\n') || '(The call just started. Greet the learner by saying hello and ask an easy first question about the topic.)'}`;
    try {
      const d = await askAI(prompt);
      if (!d || typeof d.ko !== 'string') throw new Error('shape');
      st.hist.push({ who:'nuri', text:d.ko });
      const fix = d.fix && d.fix.right ? { right:String(d.fix.right), note:String(d.fix.note || '') } : null;
      setHints((Array.isArray(d.hints) ? d.hints : []).filter(h => h && h.ko).slice(0, 3).map(h => ({ ko:String(h.ko), en:String(h.en || '') })));
      st.busy = false; await say(d.ko, d.en, fix);
      if (d.end && st.turns >= 3) setTimeout(() => !st.ended && end(), 2500);
    } catch(e){
      st.busy = false;
      cap.innerHTML = `<div class="ko">${e && e.code === 'not_granted' ? 'AI calls are switched off for this page.' : 'The connection dropped.'}</div><div class="en">${e && e.code === 'not_granted' ? 'You can allow it in this artifact\'s permissions, or use a practice call.' : 'Send your message again, or hang up and try later.'}</div>`;
    }
  }
  function scriptTurn(){ const s = cfg.call.steps[st.k]; setHints(s.opts.map(([ko, en]) => ({ ko, en }))); say(s.ko, s.en); }
  async function send(text){
    text = (text || '').trim(); if (!text || st.busy || st.ended) return;
    inp.value = ''; lastUser = text; st.turns++;
    if (cfg.mode === 'ai'){ st.hist.push({ who:'learner', text }); return aiTurn(); }
    const s = cfg.call.steps[st.k]; const goods = [].concat(s.good);
    let best = -1, bs = 0; s.opts.forEach(([ko], i) => { const a = normKo(ko.replace('___', '')), b = normKo(text); const sim = 1 - lev(a, b) / Math.max(a.length, b.length, 1); if (sim > bs){ bs = sim; best = i; } });
    const fillOK = s.fill && /저는|이에요|예요|입니다/.test(text);
    if (fillOK || (bs >= 0.5 && goods.includes(best))){
      sfx('good'); mood('happy'); await sleep(500);
      if (s.end){ await say('또 만나요! 안녕히 계세요!', 'See you again! Goodbye!'); setTimeout(() => !st.ended && end(), 1200); return; }
      st.k++; scriptTurn();
    } else { sfx('bad'); setHints(s.opts.map(([ko, en]) => ({ ko, en }))); say(bs >= 0.5 ? '음… 다시 한번 말해 줄래요?' : '음… 뭐라고요?', bs >= 0.5 ? 'Hmm… could you answer my question again?' : 'Hmm… pardon? Try one of the ideas below.'); }
  }
  $('[data-send]', ov).onclick = () => send(inp.value);
  inp.onkeydown = e => { if (e.key === 'Enter'){ e.preventDefault(); send(inp.value); } };
  const mic = $('[data-mic]', ov), SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!CAP.dictation && !SR) mic.hidden = true;
  let listening = false, stopper = null;
  mic.onclick = () => {
    if (listening){ stopper && stopper(); return; }
    listening = true; mic.classList.add('on'); let text = '';
    const fin = () => { listening = false; mic.classList.remove('on'); if (text.trim()) send(text); };
    if (CAP.dictation){
      const d = CAP.dictation, offs = [];
      offs.push(d.onPartial(e => { inp.value = (text + ' ' + e.text).trim(); }));
      offs.push(d.onFinal(e => { text += e.text; inp.value = text.trim(); clearTimeout(st.dt); st.dt = setTimeout(() => d.stop(), 1000); }));
      offs.push(d.onState(e => { if (e.state === 'idle'){ offs.forEach(f => f()); fin(); } }));
      stopper = () => d.stop();
      d.start({ language:'ko' }).catch(err => { offs.forEach(f => f()); listening = false; mic.classList.remove('on'); toast(err && err.code === 'not_granted' ? 'Microphone permission was declined. Type instead.' : 'The microphone did not start. Type instead.'); });
    } else {
      const r = new SR(); r.lang = 'ko-KR'; r.interimResults = true;
      r.onresult = e => { text = Array.from(e.results).map(x => x[0].transcript).join(''); inp.value = text; };
      r.onend = fin; r.onerror = () => {}; stopper = () => r.stop();
      try { r.start(); } catch(e){ fin(); }
    }
  };
  if (cfg.mode === 'ai') aiTurn(); else setTimeout(scriptTurn, 600);
}

/* ===== notes: a handwritten notebook of everything learned so far ===== */
let NOTES_F = 'all';
const POS_NAME = { noun:'Nouns', verb:'Verbs', adj:'Adjectives', adv:'Adverbs', exp:'Expressions', gram:'Grammar' };
function posOf(w){
  const ko = w.ko, en = w.en.toLowerCase();
  if (/^(hello|thank|thanks|goodbye|nice to meet|i am sorry|excuse me|just a moment|how much|what is it|enjoy|please|it is okay|how was it|it is not|yes|no)\b/.test(en) || (/(세요|니다|요\?)$/.test(ko) && !/^(to |it )/.test(en)) || /^(여기요|저기요|잠깐만요|네|아니요|응|아니)$/.test(ko)) return 'exp';
  if (/^(to be |it is |is |too )/.test(en) || /^(hot|cold|big|small|expensive|cheap|busy|happy|sad|tired|hungry|far|close|warm|cool|delicious|spicy|good|bad|famous|quiet|fun|tall|it was fun)\b/.test(en)) return 'adj';
  if (/^to /.test(en) || /^(go|come|see|do|study|work|sleep|read|listen|meet|like|dislike|eat|drink|buy|ride|get off|walk|went|came|ate|drank|saw|did|met|bought|live|rest|exercise|get up|take|want|will|can|cannot|have to|has to|is good at|said|says|asked|told|decided|came to|got better|almost|try|have)\b/.test(en)) return 'verb';
  if (/^(slowly|often|sometimes|again|very|really|a little|together|early|late|always|almost|not at all|quickly|quietly|diligently|suddenly|first|continuously|right away|probably|surely|not particularly|quite|barely|each other|alone|in person|especially|finally|soon|later|just now|recently|repeatedly|in the end|rather|of course|once|here|there|over there|where|why|every day|usually|still|already|as expected|gradually|nearly|in advance|more|less|the most|much|and|but|so|however|then|by the way|also)\b/.test(en)) return 'adv';
  return 'noun';
}
function notesHTML(){
  const units = UNITS.filter(u => { const st = S.units[u.id]; return st && (st.step > 0 || st.skipped); });
  const chips = ['all','noun','verb','adj','adv','exp','gram'].map(k => `<button class="nchip n-${k} ${NOTES_F === k ? 'on' : ''}" data-act="notesf" data-arg="${k}">${k === 'all' ? 'Everything' : POS_NAME[k]}</button>`).join('');
  const legend = `<div class="nlegend"><span class="w pos-noun">nouns</span><span class="w pos-verb">verbs</span><span class="w pos-adj">adjectives</span><span class="w pos-adv">adverbs</span><span class="w pos-exp">expressions</span><span class="gbox">grammar</span></div>`;
  if (!units.length) return `<div class="view-title"><div><h1>Notes</h1><p class="muted">Your notebook fills in as you learn.</p></div></div><div class="notebook"><p class="hand big">Nothing here yet. Finish your first lesson and Kkaebi will start writing.</p></div>`;
  let h = '', lastSec = -1, n = 0, wordCount = 0;
  for (const u of units){
    if (u.si !== lastSec){ lastSec = u.si; h += `<div class="nsec"><span class="hl hl${u.si % 4}">${u.sec.title}</span> <span class="ko small">${u.sec.ko}</span> <span class="muted small">${u.sec.cefr}</span>${n++ % 2 ? '' : `<span class="sticker">${bot('happy', 'still', u.si % 2 ? 's' : 'k')}</span>`}</div>`; }
    let body = '';
    if (u.kind === 'hangul'){ if (NOTES_F === 'all' || NOTES_F === 'noun') body += `<div class="letters">${u.letters.map(l => `<span class="lt" data-k="${esc(l.ch + ' ' + l.rr)}"><b class="ko">${esc(l.final ? '받침 ' + l.ch : l.ch)}</b> ${esc(l.rr)}</span>`).join('')}</div>`; }
    else if ((NOTES_F === 'all' || NOTES_F === 'gram') && u.si > 0) body += (u.guide || []).map(g => `<div class="gbox" data-k="${esc((g.h + ' ' + (g.ex || []).map(e => e.join(' ')).join(' ')).toLowerCase())}"><b>${esc(g.h)}</b> ${esc(g.p.split(/(?<=\.)\s/)[0])}${(g.ex || []).length ? `<div class="gex">${g.ex.map(([k, e]) => `<span><span class="ko">${esc(k)}</span> = ${esc(e)}</span>`).join('')}</div>` : ''}</div>`).join('');
    const ws = (u.words || []).filter(w => NOTES_F === 'all' || posOf(w) === NOTES_F); wordCount += ws.length;
    if (NOTES_F !== 'gram' && ws.length) body += `<div class="wlist">${ws.map(w => `<span class="w pos-${posOf(w)}" data-k="${esc((w.ko + ' ' + w.en).toLowerCase())}" data-say="${esc(w.ko)}"><b class="ko">${esc(w.ko)}</b> ${esc(w.en)}</span>`).join('')}</div>`;
    if (body) h += `<div class="nunit"><h3><span class="ul">${esc(u.title)}</span>${u.kind === 'hangul' ? '' : ` <span class="ko muted small">${esc(u.sub)}</span>`}</h3>${body}</div>`;
  }
  return `<div class="view-title"><div><h1>Notes</h1><p class="muted">Everything you have learned so far, in the order you learned it. Tap a word to hear it.</p></div></div>
  <div class="nbar">${chips}<input class="nsearch" data-nsearch placeholder="Search your notes" autocomplete="off"></div>

}

/* ===== moving between sections: a suspicious bag lets out smoke ===== */
const BAG_SVG = `<svg viewBox="0 0 120 130"><ellipse cx="60" cy="122" rx="40" ry="6" fill="#000" opacity=".25"/><path d="M30 52 Q14 118 60 120 Q106 118 90 52 Z" fill="#8E1E1A" stroke="#17120F" stroke-width="4"/><path d="M40 62 Q30 104 58 110" stroke="#C8312B" stroke-width="6" fill="none" stroke-linecap="round" opacity=".7"/><path d="M34 52 Q60 62 86 52 L82 36 Q60 46 38 36 Z" fill="#B0261F" stroke="#17120F" stroke-width="4" stroke-linejoin="round"/><path d="M38 36 Q60 22 82 36" fill="#1B0E0C" stroke="#17120F" stroke-width="4"/><circle class="eye" cx="52" cy="34" r="3.6" fill="#FFD21F"/><circle class="eye" cx="68" cy="34" r="3.6" fill="#FFD21F"/><path d="M34 54 Q20 60 18 72" stroke="#F2B233" stroke-width="3.5" fill="none" stroke-linecap="round"/><circle cx="18" cy="74" r="4" fill="#F2B233" stroke="#17120F" stroke-width="2"/><rect x="50" y="76" width="20" height="24" rx="3" fill="#F7E6B5" stroke="#17120F" stroke-width="3"/><path d="M55 82h10M55 88h10M57 94h6" stroke="#C8312B" stroke-width="2.6" stroke-linecap="round"/></svg>`;
function smokeTo(run){
  if ((window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) || document.querySelector('.smokeveil')) return run();
  const el = document.createElement('div'), R = Math.random; el.className = 'smokeveil'; let h = `<div class="sbag">${BAG_SVG}</div>`;
  for (let i = 0; i < 16; i++){ const a = i / 16 * Math.PI * 2, x = 50 + Math.cos(a) * (26 + R() * 24), y = 46 + Math.sin(a) * (30 + R() * 20); h += `<i style="--dx:${(x - 50).toFixed(1)}vw;--dy:${(y - 80).toFixed(1)}vh;--d:${(.1 + i * .022).toFixed(2)}s;--s:${(1.6 + R() * 1.2).toFixed(2)}"></i>`; }
  el.innerHTML = h; document.body.appendChild(el);
  setTimeout(run, 620); setTimeout(() => el.classList.add('clear'), 760); setTimeout(() => el.remove(), 1700);
}

function methodModal(){
  modal({ wide:true, title:'How Kkaebi teaches', html:`<div class="method">
  <h3>Spaced repetition</h3><p>Every word, letter and sentence you meet gets its own review schedule. Right answers push the next review further out (1, 3, 7, 16 and 35 days); a mistake brings it back within minutes. Kim and Webb's 2022 meta-analysis of 48 experiments found spaced practice has a medium-to-large effect on second-language learning.</p>
  <h3>Retrieval before recognition</h3><p>Lessons move from choosing an answer to building sentences and typing them. Pulling a word out of memory strengthens it more than rereading it, which is why Korean Made Simple also advises quizzing yourself often.</p>
  <h3>Hangul first, romanization as scaffolding</h3><p>Romanization cannot show both the spelling and the sound of a Korean word at once. Kkaebi shows it while you learn the alphabet, then suggests switching it off. It stays off by default for anyone who already reads Hangul.</p>
  <h3>Sound rules and the three-way contrast</h3><p>A unit on linking, nasalization and tensing explains why 한국어 sounds like 한구거. The sound drill trains the plain, breathy and tense consonants (가, 카, 까) that English speakers often hear as one sound.</p>
  <h3>Mixing old and new</h3><p>Every lesson slips in items from earlier units, and mistakes return at the end of the lesson. Mixed practice is harder in the moment and sticks better.</p>

  <h3>Short daily sessions</h3><p>Streaks, a daily goal and tteok that refill over time favour 10 to 20 minutes every day over long irregular sessions. The US Foreign Service Institute estimates about 2,200 class hours to reach professional working proficiency in Korean, so steady daily practice matters more than any single session.</p></div>`, actions:[{ label:'Close' }] });

    if (r.aborted || r.src.result == null) return refresh();
    const p = r.src.result, before = unitIndex(currentUnit().id); applyPlacement(p, r.src.weak || [], true); const after = unitIndex(currentUnit().id);
    await modal({ robot: after > before ? 'celebrate' : 'idle', title:'Placement done', text: after > before ? `Your path now starts at “${esc(currentUnit().title)}”.${ONB.loot && ONB.loot.n ? ` Chests opened on the way: +${ONB.loot.coins} coins.` : ''}` : 'Your current spot fits. Your path stays where it was.' });
    FIRST_RENDER = true; refresh();
  } });
}

/* ===== onboarding ===== */
let ONB = { step:0 };
function applyPlacement(p, weak, additive){
  const passed = []; COURSE.forEach((sec, si) => { if (si < p) sec.units.forEach(u => { const st = uState(u.id); if (!unitDone(u)) passed.push(u); st.skipped = true; st.step = unitSteps(u).length; }); });
  ONB.loot = lootSkipped(passed);
  S.placement = { level: Math.max(p, additive ? S.placement.level : 0), weak };
  const cnt = {}; weak.forEach(t => cnt[t] = (cnt[t] || 0) + 1); S.focus = {}; Object.keys(cnt).forEach(t => { if (cnt[t] >= 2) S.focus[t] = true; });
}
function renderOnb(){
  const app = $('#app'), s = ONB.step;
  const dots = `<div class="stepdots">${[0,1,2,3,4].map(i => `<i class="${i === Math.min(s, 4) ? 'on' : ''}"></i>`).join('')}</div>`;
  const choice = (act, arg, em, t, d, on) => `<button class="opt ${on ? 'sel' : ''}" data-act="${act}" data-arg="${arg}"><span class="em">${em}</span><span><b>${t}</b>${d ? `<br><span class="muted small">${d}</span>` : ''}</span></button>`;
  let h;
  if (s === 0) h = `<div class="rb">${bot('wave')}</div><h1>Hi, I'm Kkaebi</h1><p class="muted" style="max-width:440px">A dokkaebi, the club-carrying goblin of Korean folktales, with a weakness for rice cakes and a head full of Korean. I'll check what you already know, then build a plan that starts at your level.</p><button class="btn" style="min-width:240px" data-act="onb-next">Get started</button><p class="muted small" style="max-width:380px">Your progress saves to your Claude account, so the same path follows you from computer to phone.</p>`;
  else if (s === 1) h = `${dots}<div class="rb" style="width:130px">${bot('talk')}</div><h1>What should I call you?</h1><input data-onbname placeholder="Your name (optional)" value="${esc(S.name)}" maxlength="24"><h2 style="margin-top:8px">Why Korean?</h2><div class="choices">${[['travel','✈️','Travel'],['media','🎬','K-dramas, music and films'],['people','👪','Family and friends'],['work','💼','Study or work'],['fun','🧠','Keeping my brain busy']].map(([k, e, t]) => choice('onb-why', k, e, t, '', S.why === k)).join('')}</div><button class="btn" style="min-width:240px" data-act="onb-next">Continue</button>`;
  else if (s === 2) h = `${dots}<div class="rb" style="width:130px">${bot('idle')}</div><h1>Pick a daily goal</h1><p class="muted" style="max-width:440px">Short daily sessions beat long weekly ones. You can change this later.</p><div class="choices">${[[10,'Casual','about 5 minutes a day'],[20,'Regular','about 10 minutes a day'],[30,'Serious','about 15 minutes a day'],[50,'Intense','about 25 minutes a day']].map(([g, t, d]) => choice('onb-goal', g, '🎯', `${t}: ${g} XP`, d, S.goal === g)).join('')}</div><button class="btn" style="min-width:240px" data-act="onb-next">Continue</button>`;
  else if (s === 3) h = `${dots}<div class="rb" style="width:130px">${bot('wow')}</div><h1>How much Korean do you know?</h1><div class="choices">${[['new','🌱','I\'m new to Korean','Start with the alphabet'],['some','🔤','I know some Hangul','Short test from the alphabet up'],['basics','💬','I can read and know some basics','Test from first conversations'],['conv','🗣️','I can handle simple conversations','Test from daily life'],['inter','📚','I am at an intermediate level','Test from describing and reasoning']].map(([k, e, t, d]) => choice('onb-level', k, e, t, d, ONB.level === k)).join('')}</div><button class="btn" style="min-width:240px" data-act="onb-start" ${ONB.level ? '' : 'disabled'}>${ONB.level === 'new' ? 'Start from the alphabet' : 'Start the placement test'}</button>`;
  else {
    const p = ONB.result || 0, u = currentUnit(), mins = { 10:5, 20:10, 30:15, 50:25 }[S.goal] || 10;
    const weak = Object.keys(S.focus); const why = { travel:'Stories and calls lean on travel situations as you go.', media:'Listening drills and stories train your ear for dramas and songs.', people:'Video calls build the polite conversation skills families notice.', work:'Polite and formal endings get extra attention in the guidebooks.', fun:'Mixed review keeps every session a little puzzle.' }[S.why] || '';
    h = `<div class="rb">${bot('celebrate')}</div><h1>Your plan</h1><div class="plan">
     <div class="pl"><span class="e">📍</span><div><b>Start: Section ${u.si + 1}, ${esc(u.sec.title)} (${u.sec.cefr})</b><div class="muted small">${p === 0 ? 'You begin with Hangul. Most learners can read it after a few short sessions.' : `The test showed you can skip ${plural(p, 'section')}. Skipped units still feed your reviews.${ONB.loot && ONB.loot.n ? ` The ${plural(ONB.loot.n, 'treasure chest')} on the way were opened for you: +${ONB.loot.coins} coins.` : ''}`}</div></div></div>
     <div class="pl"><span class="e">🔤</span><div><b>Romanization ${S.settings.roma ? 'on' : 'off'}</b><div class="muted small">${p === 0 ? (S.settings.roma ? 'Latin letters show under Korean while you learn the alphabet. Turn them off in Settings once you can read.' : 'Suggestion: while you learn the alphabet, Latin letters under Korean help you link letters to sounds. Without them you learn by listening.') : 'You read Hangul, so Latin letters stay hidden. You can turn them on in Settings.'}</div>${p === 0 ? `<button class="btn small ${S.settings.roma ? 'ghost' : 'sun'}" style="margin-top:8px" data-act="romaplan">${S.settings.roma ? 'Turn them off' : 'Turn them on for now'}</button>` : ''}</div></div>
     <div class="pl"><span class="e">🎯</span><div><b>${S.goal} XP a day, about ${mins} minutes</b><div class="muted small">Each day: one new lesson and one review. Concept lessons, stories and video calls come up along the path.</div></div></div>
     ${weak.length ? `<div class="pl"><span class="e">🔧</span><div><b>Extra focus: ${weak.map(t => TAGNAME[t] || t).join(', ')}</b><div class="muted small">The test showed slips here, so lessons add a few more of these exercises.</div></div></div>` : ''}
     ${why ? `<div class="pl"><span class="e">💡</span><div><b>Because you chose “${esc({ travel:'Travel', media:'K-dramas, music and films', people:'Family and friends', work:'Study or work', fun:'Keeping my brain busy' }[S.why])}”</b><div class="muted small">${why}</div></div></div>` : ''}
     <div class="pl"><span class="e">🍡</span><div><b>Kkaebi runs on tteok</b><div class="muted small">Tteok are rice cakes. A lesson uses up to 10 of Kkaebi's 30, one per answer. They refill by 5 every 30 minutes, or you can earn them with a quick quiz.</div></div></div></div>
     <button class="btn" style="min-width:260px" data-act="onb-finish">Start learning</button>`;
  }
  app.innerHTML = `<div class="onb">${h}</div>`;
  const ni = $('[data-onbname]'); if (ni) ni.oninput = e => { S.name = e.target.value.slice(0, 24); };
}
function onbStart(){
  if (ONB.level === 'new'){ applyPlacement(0, []); ONB.result = 0; ONB.step = 5; save(); return renderOnb(); }
  const L0 = { some:0, basics:1, conv:2, inter:5 }[ONB.level];
  startSession(placementSource(L0), { onEnd: r => {
    if (r.aborted || r.src.result == null){ ONB.step = 3; return renderOnb(); }
    applyPlacement(r.src.result, r.src.weak || []); ONB.result = r.src.result; ONB.step = 5; save(); renderOnb();
  } });
}

/* ===== actions ===== */
function go(v){ if (v === VIEW && v !== 'learn') return; VIEW = v; if (v === 'learn') FIRST_RENDER = true; if (v !== 'shop') TRY = null; smokeTo(() => { renderApp(); window.scrollTo(0, 0); }); }
const ACT = {
  go: a => go(a), settings:settingsModal, streak:streakModal, bolts:boltsModal, method:methodModal, chart:chartModal,
  today: () => modal({ wide:true, title:'Today', html:`<div style="display:flex;flex-direction:column;gap:14px">${railHTML()}</div>`, actions:[{ label:'Close' }] }),
  step: a => openStep(a),
  drill: a => unitDrill(UNIT[a]),
  inspect: () => modal({ wide:true, title:'Kkaebi and Sori, all the way round', text:'Drag either one to spin it. Everything you equip in the shop shows here.', html:`<div class="spinduo">${['k','s'].map(w => { const e = eqOf(w); return `<div class="spinbox" ${e.scene ? `style="background-image:url('${sceneURL(e.scene.replace('scene_', ''))}')"` : ''}><canvas data-k3='${esc(JSON.stringify(equipOpts(e, 'idle', w)))}'></canvas><b>${WHO_NAME[w]}</b></div>`; }).join('')}</div>`, actions:[{ label:'Open the fitting room', fn:() => go('shop') }, { label:'Close', cls:'ghost' }], onOpen:m => k3mount(m) }),
  talk: () => modal({ wide:true, robot:'wave', title:'Free talk with Kkaebi', text:'Pick a topic. Claude plays Kkaebi and answers at your level.', html:`<div class="grid2">${CALL_TOPICS.map(t => `<button class="tile" data-topic="${t.id}"><div style="display:flex;gap:12px;align-items:center"><span style="font-size:28px">${t.em}</span><div><b>${t.t}</b><div class="muted small">${t.d}</div></div></div></button>`).join('')}</div>`, actions:[{ label:'Close', cls:'ghost' }], onOpen:(m, close) => $$('[data-topic]', m).forEach(b => b.onclick = () => { close(); startCall({ mode:'ai', topic:CALL_TOPICS.find(t => t.id === b.dataset.topic) }); }) }),
  review: a => { const u = UNIT[a]; if (!unitDone(u)) return toast('Finish all lessons in this unit to open the review.'); startLesson(u, 'review'); },
  jump: a => jumpOffer(unitById(a).u),
  testout: a => jumpOffer(UNIT[a], true),
  chest: a => { const u = UNIT[a], st = uState(u.id); if (st.chest) return toast('Already opened.'); if (!(unitDone(u) || lessonsDone(u) >= 2)) return toast('Finish two lessons in this unit to open the chest.'); st.chest = true; const mb = 16 * (1 + rnd(3)); addMB(mb); const b = addBolts(5); save(); sfx('coin'); modal({ art:`<div style="width:90px;margin:0 auto">${giftSVG('mb')}</div>`, title:'Chest opened', text:`+${mb} coins${b ? ' and +' + b + ' tteok' : ''}.` }).then(refresh); },
  guide: a => guideModal(a), practice: a => practice(a), refuel: () => refuelQuiz(),
  story: a => { const st = STORIES.find(x => x.id === a); if (!storyUnlocked(st)) return toast('Finish “' + UNIT[st.after].title + '” to open this story.'); playStory(st); },
  aistory: () => { toast('Claude is writing a story. This takes a few seconds.'); aiStory(null); },
  aicall: a => startCall({ mode:'ai', topic: CALL_TOPICS.find(t => t.id === a) }),
  scall: a => { const c = CALLS.find(x => x.id === a); if (!unitDone(UNIT[c.after])) return toast('Finish “' + UNIT[c.after].title + '” to open this call.'); startCall({ mode:'script', call:c }); },
  shoptab: a => { SHOP_TAB = a; const g = $('[data-shopgrid]'); $$('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.arg === a)); if (g) g.innerHTML = shopGrid(); else renderView(); }, try: a => tryItem(a), item: a => itemPop(a), trykeep: () => tryKeep(), tryreset: () => { TRY = null; shopUpdate(); }, power: a => buyPower(a),
  shopwho: a => { SHOP_WHO = a; TRY = null; renderView(); }, dress: a => { SHOP_WHO = a; TRY = null; SHOP_TAB = 'head'; go('shop'); }, notesf: a => { NOTES_F = a; renderView(); },
  badge: a => badgeModal(+a), road: () => claimRoad(),
  quest: a => { const q = S.quests.list[+a]; if (!q || !q.done || q.claimed) return; q.claimed = true; addMB(16); sfx('coin'); refresh(); toast('+16 coins'); },
  chestday: () => { if (todayXP() < S.goal || S.chestDay === dayKey()) return; S.chestDay = dayKey(); addMB(16); const b = addBolts(5); sfx('coin'); refresh(); modal({ art:`<div style="width:90px;margin:0 auto">${giftSVG('mb')}</div>`, title:'Daily chest', text:`+16 coins${b ? ' and +' + b + ' tteok' : ''}. Same time tomorrow?` }); },
  'onb-next': () => { if (ONB.step === 1 && !S.why) return toast('Pick a reason, or choose “Keeping my brain busy”.'); ONB.step++; renderOnb(); },
  'onb-why': a => { S.why = a; renderOnb(); }, 'onb-goal': a => { S.goal = +a; renderOnb(); },
  'onb-level': a => { ONB.level = a; renderOnb(); }, 'onb-start': () => onbStart(),
  romaplan: () => { S.settings.roma = !S.settings.roma; save(); renderOnb(); },
  'onb-finish': () => { S.onboarded = true; S.league.week = weekStart(); ensureQuests(); save(); FIRST_RENDER = true; renderApp(); },
};
document.addEventListener('click', e => {
  const s = e.target.closest('[data-say]'); if (s && !s.closest('.overlay')){ e.preventDefault(); speak(s.dataset.say, false, s); return; }
  const t = e.target.closest('[data-act]'); if (!t || t.closest('.overlay') || t.closest('.callwrap')) return;
  const f = ACT[t.dataset.act]; if (f){ e.preventDefault(); f(t.dataset.arg, t, e); }
});

/* ===== boot ===== */
function dailyChecks(){
  const q = []; refreshBolts(); ensureQuests();
  const sc = checkStreak();
  if (sc && sc.saved) q.push(() => modal({ robot:'happy', title:'Streak saved', text:`A lucky charm covered ${plural(sc.saved, 'missed day')}. Your ${S.streak.count}-day streak is safe.` }));
  if (sc && sc.lost) q.push(() => modal({ robot:'sad', title:'Your streak reset', text:`Your ${sc.lost}-day streak ended. One lesson today starts a new one. Lucky charms in the shop protect future streaks.` }));
  const lr = rolloverLeague();
  if (lr) q.push(() => modal({ art:`<div style="width:90px;margin:0 auto">${tierSVG(lr.tier)}</div>`, title: lr.tier > lr.old ? `Promoted to ${TIERS[lr.tier].n}` : lr.tier < lr.old ? `Moved down to ${TIERS[lr.tier].n}` : `You stay in ${TIERS[lr.tier].n}`, text:`You finished #${lr.rank} last week.${lr.rank <= 3 ? ' Podium bonus: ' + [128, 96, 64][lr.rank - 1] + ' coins.' : ''}` }));
  const b = checkBadge(); if (b) q.push(() => modal({ art:`<div style="width:190px;margin:0 auto">${badgeSVG(b, S.equip)}</div>`, title: MONTHS[b].n + ' badge earned', text:`${ITEMS[MONTHS[b].item].name} joined your wardrobe.` }));
  const df = (S.deferred || [])[0];
  if (df && UNIT[df.u] && unitSteps(UNIT[df.u])[df.j]) q.push(() => modal({ robot:'wave', title:'Unfinished chapter', text:`Last time you saved “${esc(stepName(UNIT[df.u], df.j))}” for later${S.deferred.length > 1 ? ', along with ' + plural(S.deferred.length - 1, 'other chapter') : ''}. Do it now?`, actions:[{ label:'Do it now', fn:() => openStep(df.u + '|' + df.j, true) }, { label:'Remind me next time', cls:'ghost' }] }));
  save(); runQueue(q);
}
function tick(){
  if (!S || !S.onboarded) return;
  if (dayKey() !== LAST_DAY){ LAST_DAY = dayKey(); dailyChecks(); if (!RUN) renderApp(); return; }
  if (!RUN) updateStatus();
}
function boot(){
  S = loadLocal() || freshState();
  applyTheme();
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch(e){}
  initCaps(() => { if (S.onboarded && !RUN && VIEW === 'practice' && !document.querySelector('.modal-bg')) renderView(); });
  if (S.onboarded){ dailyChecks(); renderApp(); } else renderOnb();
  initRemote(changed => { if (!changed) return; applyTheme(); if (S.onboarded){ if (!RUN && !document.querySelector('.callwrap')){ dailyChecks(); FIRST_RENDER = true; renderApp(); toast('Progress synced from your account.'); } } });
  if (!document.querySelector('.embers')) document.body.insertAdjacentHTML('beforeend', '<div class="embers" aria-hidden="true">' + Array.from({ length:14 }, (_, i) => `<i style="left:${(i * 7.3 + 3) % 100}%;--t:${9 + (i * 37 % 9)}s;--d:${-(i * 1.7 % 12)}s;--x:${(i * 53 % 80) - 40}px;--s:${.6 + (i % 4) * .25}"></i>`).join('') + '</div>');
  setInterval(tick, 15000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
}
boot();

</script>
<script>
(function(){
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
  var standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone;
  if (standalone) return;
  var KEY = 'nuri-install-dismissed', ev = null;
  function bar(text, btn, fn){
    try { if (localStorage.getItem(KEY)) return null; } catch(e){}
    var d = document.createElement('div'); d.className = 'installbar'; var s = document.createElement('span'); s.textContent = text; d.appendChild(s);
    if (btn){ var b = document.createElement('button'); b.className = 'btn small'; b.textContent = btn; b.onclick = fn; d.appendChild(b); }
    var x = document.createElement('button'); x.className = 'iconbtn'; x.setAttribute('aria-label', 'Dismiss'); x.textContent = '\u2715'; x.onclick = function(){ try { localStorage.setItem(KEY, '1'); } catch(e){} d.remove(); }; d.appendChild(x);
    document.body.appendChild(d); return d;
  }
  window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); ev = e; var d = bar('Install Kkaebi as an app on this device.', 'Install', function(){ ev.prompt(); ev.userChoice.then(function(){ if (d) d.remove(); }); }); });
  window.addEventListener('appinstalled', function(){ var d = document.querySelector('.installbar'); if (d) d.remove(); });
  var ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (ios) setTimeout(function(){ bar('To install Kkaebi: tap the Share button, then \u201CAdd to Home Screen\u201D.'); }, 2500);
})();
</script>
